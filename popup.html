<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon-clay" title="Domain Swap">
          <img src="icon128.webp" alt="Domain Swap Icon" class="brand-icon-img">
        </div>
        <div class="brand-info">
          <h1>Domain Swap</h1>
          <span class="brand-tagline">Dynamic Domain Redirector</span>
        </div>
      </div>
      <span class="header-badge">v1.2.1</span>
    </header>
    
    <!-- Add / Edit Redirect Section -->
    <section class="add-section" aria-labelledby="add-section-heading">
      <div class="section-header">
        <h2 id="add-section-heading">
          <span class="section-indicator section-indicator-cyan"></span>
          Add / Edit Redirect
        </h2>
      </div>
      
      <input type="hidden" id="editId" value="">
      
      <div class="form-group">
        <label for="fromDomain">
          <svg class="label-icon-amber" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          From (domain):
        </label>
        <input type="text" id="fromDomain" placeholder="e.g. domain1.com, domain2.com" autocomplete="off" spellcheck="false">
        <small>Enter origin domains separated by commas</small>
      </div>
      
      <div class="form-group">
        <label for="toDomain">
          <svg class="label-icon-cyan" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          To (domain):
        </label>
        <input type="text" id="toDomain" placeholder="e.g. new-destination.com" autocomplete="off" spellcheck="false">
        <small>Enter destination domain</small>
      </div>
      
      <div class="form-actions">
        <button id="addButton" class="btn btn-primary" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          <span id="addBtnText">Add Redirect</span>
        </button>
        <button id="cancelEditButton" class="btn btn-secondary" type="button" style="display: none;">Cancel</button>
      </div>
    </section>
    
    <!-- Configured Redirects List Section -->
    <section class="list-section" aria-labelledby="list-section-heading">
      <div class="section-header">
        <h2 id="list-section-heading">
          <span class="section-indicator section-indicator-amber"></span>
          Configured Redirects
        </h2>
      </div>
      
      <div id="redirectsList"></div>
      
      <div id="emptyMessage" class="empty-message">
        <div class="empty-icon-clay" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </div>
        <div class="empty-message-title">No redirects configured</div>
        <div class="empty-message-subtitle">Add your first domain swap rule above to get started</div>
      </div>
    </section>

    <!-- Paste JSON Section (Direct Paste & File Upload) -->
    <section class="add-section import-section" id="importSection" aria-labelledby="import-section-heading">
      <div class="section-header">
        <h2 id="import-section-heading">
          <span class="section-indicator" style="background: var(--clay-primary-light);"></span>
          Paste JSON
        </h2>
        <button id="closeImportSectionBtn" class="btn-icon" type="button" title="Close" style="padding: 4px 8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="form-group" style="margin-bottom: 10px;">
        <textarea id="importJsonTextarea" class="clay-textarea" spellcheck="false" placeholder='[
  {
    "from": ["old-domain.com", "legacy-site.org"],
    "to": "new-destination.com",
    "enabled": true
  }
]'></textarea>
      </div>

      <div class="import-file-row">
        <button id="triggerFilePicker" class="btn btn-secondary btn-upload" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Upload a File
        </button>
      </div>

      <div id="importFeedback" class="feedback-banner"></div>

      <div class="form-actions" style="margin-top: 12px;">
        <button id="mergeImportButton" class="btn btn-secondary" type="button" title="Merge rules">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Merge
        </button>
        <button id="overwriteImportButton" class="btn btn-primary" type="button" title="Overwrite rules">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Overwrite
        </button>
      </div>
    </section>
    
    <!-- Footer Utility Bar -->
    <footer class="footer">
      <button id="exportButton" class="btn btn-secondary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export
      </button>
      <button id="importButton" class="btn btn-secondary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Import
      </button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </footer>

    <template id="redirectItemTemplate">
      <div class="rule-card-inner">
        <!-- Top Row: Status and Actions -->
        <div class="rule-card-header">
          <div class="rule-status-group">
            <label class="toggle-switch" title="Toggle On/Off">
              <input type="checkbox" class="toggle-checkbox">
              <span class="slider"></span>
            </label>
            <span class="status-pill"></span>
          </div>
          
          <div class="rule-actions-group">
            <button class="btn-icon btn-edit" title="Edit Rule" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> 
              Edit
            </button>
            <button class="btn-icon btn-delete" title="Delete Rule" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> 
              Delete
            </button>
          </div>
        </div>
        
        <!-- Routing Flow Section -->
        <div class="routing-flow">
          <div class="flow-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
            From origins:
          </div>
          <div class="flow-chips-group origin-chips"></div>

          <div class="routing-separator">
            <div class="routing-separator-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            </div>
          </div>
          
          <div class="flow-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Redirects to:
          </div>
          <div class="domain-chip domain-chip-target">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span class="target-text"></span>
          </div>
        </div>
      </div>
    </template>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
